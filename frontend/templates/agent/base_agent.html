{% extends "base.html" %}
{% block contenu %}
<div class="mise-en-page-agent">
    <aside class="sidebar-agent">
        <div class="sidebar-agent__logo">BBDA Events</div>
        <nav class="sidebar-agent__menu">
            <a href="{{ url_for('agent.tableau_de_bord') }}" class="{{ 'actif' if request.endpoint == 'agent.tableau_de_bord' else '' }}">Tableau de bord</a>
            <a href="{{ url_for('agent.declarations') }}" class="{{ 'actif' if request.endpoint == 'agent.declarations' else '' }}">Déclarations</a>
            <a href="{{ url_for('agent.arrieres') }}" class="{{ 'actif' if request.endpoint == 'agent.arrieres' else '' }}">Arriérés</a>
            <a href="{{ url_for('agent.surveillance') }}" class="{{ 'actif' if request.endpoint == 'agent.surveillance' else '' }}">Surveillance</a>
            {% if current_user.is_authenticated and current_user.role == "admin" %}
            <a href="{{ url_for('admin.tableau_de_bord') }}">Espace admin</a>
            {% endif %}
            <a href="{{ url_for('auth.parametres') }}" class="{{ 'actif' if request.endpoint and request.endpoint.startswith('auth.') else '' }}">Mon compte</a>
            <a href="{{ url_for('auth.deconnexion') }}">Déconnexion</a>
        </nav>
    </aside>
    <div class="contenu-agent">
        {% block contenu_agent %}{% endblock %}
    </div>
</div>
{% endblock %}
