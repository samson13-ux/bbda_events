{% extends "base.html" %}
{% block titre %}BBDA Events : Créer un compte{% endblock %}
{% block contenu %}
<div class="carte-formulaire carte-formulaire--large">
    <h1 class="titre-formulaire">Créer un compte organisateur</h1>

    <form method="post" action="{{ url_for('auth.inscription') }}" novalidate>
        {% include '_csrf.html' %}
        <div class="ligne-deux-colonnes">
            <div class="champ-formulaire">
                <label for="nom">Nom <span class="obligatoire">*</span></label>
                <input type="text" id="nom" name="nom" value="{{ donnees.nom if donnees else '' }}" required>
            </div>
            <div class="champ-formulaire">
                <label for="prenom">Prénom <span class="obligatoire">*</span></label>
                <input type="text" id="prenom" name="prenom" value="{{ donnees.prenom if donnees else '' }}" required>
            </div>
        </div>

        <div class="champ-formulaire">
            <label for="qualite">Qualité <span class="obligatoire">*</span></label>
            <select id="qualite" name="qualite" required>
                <option value="Organisateur" {% if donnees and donnees.qualite == "Organisateur" %}selected{% endif %}>Organisateur</option>
                <option value="Promoteur culturel" {% if donnees and donnees.qualite == "Promoteur culturel" %}selected{% endif %}>Promoteur culturel</option>
                <option value="Association" {% if donnees and donnees.qualite == "Association" %}selected{% endif %}>Association</option>
                <option value="Autre" {% if donnees and donnees.qualite == "Autre" %}selected{% endif %}>Autre</option>
            </select>
        </div>

        <div class="ligne-deux-colonnes">
            <div class="champ-formulaire">
                <label for="telephone">Téléphone <span class="obligatoire">*</span></label>
                <input type="tel" id="telephone" name="telephone" value="{{ donnees.telephone if donnees else '' }}" placeholder="70 00 00 00" required>
            </div>
            <div class="champ-formulaire">
                <label for="email">Email <span class="obligatoire">*</span></label>
                <input type="email" id="email" name="email" value="{{ donnees.email if donnees else '' }}" placeholder="vous@exemple.bf" required>
            </div>
        </div>

        <div class="ligne-deux-colonnes">
            <div class="champ-formulaire">
                <label for="password">Mot de passe <span class="obligatoire">*</span></label>
                <input type="password" id="password" name="password" placeholder="8 caractères minimum" required minlength="8">
            </div>
            <div class="champ-formulaire">
                <label for="confirm">Confirmer le mot de passe <span class="obligatoire">*</span></label>
                <input type="password" id="confirm" name="confirm" placeholder="Ressaisir le mot de passe" required minlength="8">
            </div>
        </div>

        <label class="champ-case">
            <input type="checkbox" name="cgu" value="1">
            <span>J'accepte les conditions générales d'utilisation et la politique de confidentialité du BBDA.</span>
        </label>

        <button type="submit" class="bouton-soumettre bouton-soumettre--espace">Créer mon compte</button>
    </form>

    <p class="lien-secondaire">
        Vous avez déjà un compte ? <a href="{{ url_for('auth.connexion') }}">Se connecter</a>
    </p>
</div>
{% endblock %}
