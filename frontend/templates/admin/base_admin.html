{% extends "base.html" %}
{% block contenu %}
<div class="mise-en-page-admin">
    <aside class="sidebar-admin">
        <div class="sidebar-admin__logo">BBDA Events : Admin</div>
        <nav class="sidebar-admin__menu">
            <a href="{{ url_for('admin.tableau_de_bord') }}" class="{{ 'actif' if request.endpoint == 'admin.tableau_de_bord' else '' }}">Tableau de bord</a>
            <a href="{{ url_for('admin.statistiques') }}" class="{{ 'actif' if request.endpoint == 'admin.statistiques' else '' }}">Statistiques</a>
            <a href="{{ url_for('admin.messages_contact') }}" class="{{ 'actif' if request.endpoint and 'messages_contact' in request.endpoint else '' }}">Messages contact</a>
            <a href="{{ url_for('admin.evenements_publics') }}" class="{{ 'actif' if request.endpoint and 'evenement' in (request.endpoint or '') else '' }}">Événements publics</a>
            <a href="{{ url_for('admin.utilisateurs') }}" class="{{ 'actif' if request.endpoint == 'admin.utilisateurs' else '' }}">Utilisateurs</a>
            <a href="{{ url_for('admin.parametres') }}" class="{{ 'actif' if request.endpoint == 'admin.parametres' else '' }}">Paramètres système</a>
            <a href="{{ url_for('auth.parametres') }}">Mon compte</a>
            <a href="{{ url_for('auth.deconnexion') }}">Déconnexion</a>
        </nav>
    </aside>
    <div class="contenu-admin">
        {% block contenu_admin %}{% endblock %}
    </div>
</div>
{% endblock %}
